leaf:
  resource: /resources/
  # 是否开启全局跨域
  global.cors: false
  # 前/后台用户登录有66效时间(秒) 0表示立马失效 -1表示浏览器关闭后失效（token过期时间为24小时） 默认:后台 2592000秒（30天） 前台 7776000秒（90天）
  login:
    frontend_time: 7776000
    backend_time: 2592000
  validCode:
    # 验证码有效时间（秒） 默认:180
    duration: 180
  validPuzzle:
    # 验证拼图有效时间（秒） -1表示永久有效 默认:120
    duration: 120
    # 拼图验证拼图路径
    path: /ls/puzzleImg/
    # 验证拼图有效范围（到正确点位的距离） 800为最大值，默认:5
    range: 10

