      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接池大小
      maximum-pool-size: 20
      # 空闲连接最大存活时间（毫秒）
      idle-timeout: 30000
      # 连接最大存活时间（毫秒）
      max-lifetime: 1800000
      # 获取连接超时时间（毫秒）
      connection-timeout: 20000
