<!doctype html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>系统日志</title>
    <link rel="stylesheet" href="/lib/ant-design-vue/antd.min.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        #app {
            height: 100%;
            padding: 16px;
        }
        .ant-card-body {
            height: calc(100% - 60px);
        }
        .log-container {
            height: 100%;
            display: flex;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
        }
        .log-tree {
            width: 300px;
            border-right: 1px dashed #999;
            padding: 16px;
            overflow: auto;
        }
        .log-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .log-iframe {
            padding: 10px;
            flex: 1;
            border: none;
            border-radius: 5px;
            background: #3e3e3e;
            color: #fff;
            overflow-x: hidden;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: Consolas, Menlo, monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        .tree-actions {
            margin-bottom: 12px;
        }
        .ant-tree-node-content-wrapper {
            width: calc(100% - 24px);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 日志高亮样式 */
        .log-separator .log-level {
            font-weight: bold;
            color: #ff4d4f;
        }
        .log-separator .log-time {
            color: #40a9ff;
            margin-left: 6px;
        }
        .log-separator .log-line {
            color: #faad14;
        }
    </style>
</head>
<body>
<div id="app">
    <a-card :bordered="false" style="height: 100%;">
        <template slot="title"><h3 style="margin: 0;">系统日志</h3></template>

        <div class="log-container">
            <!-- 日志树 -->
            <div class="log-tree">
                <div class="tree-actions">
                    <a-button-group>
                        <a-button @click="expandAll">全部展开</a-button>
                        <a-button @click="collapseAll">全部折叠</a-button>
                    </a-button-group>
                    <a-button @click="loadLogTree(null, expandedKeys)">
                        <a-icon type="reload"></a-icon>
                    </a-button>
                </div>

                <a-tree
                        v-if="treeData.length > 0"
                        :tree-data="treeData"
                        :replace-fields="{ children: 'children', title: 'name', key: 'key' }"
                        :expanded-keys="expandedKeys"
                        @expand="onExpand"
                        @select="handleTreeSelect"
                >
                    <template slot="title" slot-scope="{ name, type, log_url }">
                        <span :title="name">{{ name }}</span>
                        <span v-if="type === 'file'" style="float: right; margin-right: 20px;">
                            <a-dropdown :trigger="['click']">
                                <a-icon type="ellipsis"></a-icon>
                                <a-menu slot="overlay">
                                    <a-menu-item @click="handleRename(log_url, name)">重命名</a-menu-item>
                                    <a-menu-item @click="handleDelete(log_url, name)">删除</a-menu-item>
                                </a-menu>
                            </a-dropdown>
                        </span>
                    </template>
                </a-tree>

                <a-spin v-else style="width: 100%; text-align: center;" />
            </div>

            <!-- 日志内容 -->
            <div class="log-content">
                <div style="margin-bottom: 8px;">
                    <a-button size="small" @click="refreshCurrentLog" :disabled="!currentLogUrl">
                        <a-icon type="reload"></a-icon> 刷新日志
                    </a-button>
                </div>

                <div v-if="currentLogUrl" id="log-content" class="log-iframe" v-html="currentLogContent"></div>
            </div>
        </div>
    </a-card>

    <!-- 重命名模态框 -->
    <a-modal
            v-model="renameModalVisible"
            title="重命名日志文件"
            @ok="handleRenameConfirm"
            @cancel="renameModalVisible = false"
    >
        <a-input v-model="newFileName" placeholder="请输入新文件名" />
    </a-modal>
</div>

<script src="/lib/leaf-system/antd1.7.8.all.min.js"></script>
<script src="/lib/vue/vue-dash-event.js"></script>
<script src="/lib/leaf-common/leaf-common.min.js"></script>
<script src="/lib/leaf-system/leaf-system-common.js"></script>

<script>
    Vue.use(antd);
    let _this = null;

    new Vue({
        el: '#app',
        data() {
            return {
                treeData: [],
                expandedKeys: [],
                currentLogUrl: '',
                currentLogContent: '',
                renameModalVisible: false,
                newFileName: '',
                currentRenameUrl: '',
                nodeKey: 0
            };
        },
        created() {
            _this = this;
            this.loadLogTree(true);
        },
        methods: {
            loadLogTree(isExpandedFirst, expandedKeys) {
                fetch('/system/api/log/getLog')
                    .then(res => res.json())
                    .then(data => {
                        if (data.IsSuccess === '1') {
                            this.treeData = this.formatTreeData(data.data);
                            if (expandedKeys) {
                                this.expandedKeys = expandedKeys;
                            } else if (isExpandedFirst) {
                                this.expandedKeys = this.treeData
                                    .filter(n => n.type === 'dir')
                                    .map(n => n.key);

                                // 展开第一级的第一级的第一级
                                if (this.treeData[0]) {
                                    if (this.treeData[0].children && this.treeData[0].children[0]) {
                                        this.expandedKeys.push(this.treeData[0].children[0].key);

                                        if (this.treeData[0].children[0].children && this.treeData[0].children[0].children[0]) {
                                            this.expandedKeys.push(this.treeData[0].children[0].children[0].key);
                                        }
                                    }
                                }
                            }
                        }
                    });
            },
            formatTreeData(nodes) {
                return nodes.map(node => {
                    const item = { ...node, scopedSlots: { title: 'title' } };
                    item.key = node.type === 'dir'
                        ? 'dir_' + node.path.replace(/\//g, '')
                        : 'file_' + this.nodeKey++;
                    if (node.children) {
                        item.children = this.formatTreeData(node.children);
                    }
                    return item;
                });
            },
            handleTreeSelect(keys, { selectedNodes }) {
                if (!selectedNodes.length) return;
                const node = selectedNodes[0];
                if (node.data.props.type === 'file') {
                    this.currentLogUrl = node.data.props.log_url;
                    this.loadLogData(this.currentLogUrl);
                }
            },
            loadLogData(url) {
                fetch(url + '?_t=' + Date.now())
                    .then(res => res.text())
                    .then(text => {
                        this.currentLogContent = this.formatLogContent(text);
                        this.$nextTick(() => {
                            const el = document.getElementById('log-content');
                            el.scrollTop = el.scrollHeight;
                        });
                    });
            },
            refreshCurrentLog() {
                this.loadLogData(this.currentLogUrl);
            },
            formatLogContent(content) {
                const escape = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                content = escape(content);
                return content.replace(
                    /\[\s*(ERROR|INFO|WARN|DEBUG)\s*-\s*([\d\-:\s]+)\s*(=+)\s*\]/g,
                    (_, level, time, line) => `<div class="log-separator">[ <span class="log-level">${level}</span> - <span class="log-time">${time}</span> <span class="log-line">${line}</span> ]</div>`);
            },
            expandAll() {
                const walk = nodes => nodes.flatMap(n => [n.key, ...(n.children ? walk(n.children) : [])]);
                this.expandedKeys = walk(this.treeData);
            },
            collapseAll() {
                this.expandedKeys = [];
            },
            onExpand(keys) {
                this.expandedKeys = keys;
            },
            handleRename(log_url, name) {
                this.currentRenameUrl = log_url;
                this.newFileName = name;
                this.renameModalVisible = true;
            },
            handleRenameConfirm() {
                if (!this.newFileName.trim()) {
                    this.$message.warning('请输入有效的文件名');
                    return;
                }

                Ajax.post({
                    url: '/system/api/log/updateLog?UpdateType=Rename',
                    param: {
                        log_url: _this.currentRenameUrl,
                        new_name: _this.newFileName
                    },
                    success(result) {
                        if(result.IsSuccess === '1') {
                            _this.$message.success('重命名成功');
                            _this.renameModalVisible = false;
                            _this.loadLogTree(null, _this.expandedKeys); // 重新加载数据
                        } else {
                            _this.$message.warning(result.Msg);                        }
                    }
                });
            },
            handleDelete(log_url, name) {
                this.$confirm({
                    title: '确认删除',
                    content: `确定要删除日志【${name}】?`,
                    okText: '确定',
                    okType: 'danger',
                    cancelText: '取消',
                    onOk() {
                        Ajax.post({
                            url: '/system/api/log/updateLog?UpdateType=Delete',
                            param: {
                                log_url: log_url
                            },
                            success(result) {
                                if(result.IsSuccess === '1') {
                                    _this.$message.success('删除成功');
                                    _this.loadLogTree(null, _this.expandedKeys); // 重新加载数据
                                    _this.currentLogUrl = null;
                                } else {
                                    _this.$message.warning(result.Msg);                        }
                            }
                        });
                    }
                });
            },
        }
    });
</script>
</body>
</html>
